<div class="container">
  <legend>Create Items</legend>
  <form>
    <div class="mb-3">
      <label for="txtName" class="form-label">Name</label>
      <input
        type="text"
        name="name"
        [(ngModel)]="formdata.name"
        id="txtName"
        class="form-control"
      />
    </div>

    <div class="mb-3">
      <label for="txtPrice" class="form-label">Price</label>
      <input
        type="number"
        name="price"
        [(ngModel)]="formdata.price"
        id="txtPrice"
        class="form-control"
      />
    </div>

    <div class="mb-3">
      <label for="quantity" class="form-label">Quantity</label>
      <input
        type="number"
        name="quantity"
        [(ngModel)]="formdata.quantity"
        id="quantity"
        class="form-control"
      />
    </div>

    <button class="btn btn-primary" type="button" (click)="create()">
      Create
    </button>
  </form>
</div>
